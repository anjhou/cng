name: Refresh US energy data
on:
  schedule:
    - cron: '50 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-energy-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_us_energy.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/data/us-energy.csv static/data/us-energy-meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh EIA US energy data'
            git pull --rebase
            git push
          fi
