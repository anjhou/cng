<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
<defs>
<marker id="arrowhead_f" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="blue" />
</marker>
							
<marker id="arrowhead_b" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="blue" />
</marker>

<marker id="startarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="10 0, 10 7, 0 3.5" fill="blue" />
</marker>

<marker id="endarrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
<polygon points="0 0, 10 3.5, 0 7" fill="blue" />
</marker>

<marker id="endarrowr" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
<polygon points="0 0, 10 3.5, 0 7" fill="red" />
</marker>
<!---->
<!--SVG grid lines -->


<pattern id="smallGrid" width="8" height="8" patternUnits="userSpaceOnUse">
<path d="M 8 0 L 0 0 0 8" fill="none" stroke="gray" stroke-width="0.1"/>
</pattern>

<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
<rect width="80" height="80" fill="url(#smallGrid)"/>
<path d="M 80 0 L 0 0 0 80" fill="none" stroke="gray" stroke-width="0.5"/>
</pattern>
<!---->
<!--Color linear Horizontal gradient -->

<linearGradient id="gradientH"> 
<stop offset="70%" stop-color="#0033cc" />
<stop offset="90%" stop-color="#339966" />
</linearGradient>

<!--Color linear vertical gradient -->
	
<linearGradient id="gradientV" x1="0" x2="0" y1="0" y2="1">
<stop offset="22%" stop-color="#00ff00" />
<stop offset="44%" stop-color="#339966" />
<stop offset="100%" stop-color="#0033cc" />
</linearGradient>

<!--Color linear vertical gradient -->
	
<linearGradient id="gradientV1" x1="0" x2="0" y1="0" y2="1">
<stop offset="22%" stop-color="#00ff00" />
<stop offset="44%" stop-color="#339966" />
<stop offset="100%" stop-color="#0033cc" />
</linearGradient>

<!--Color linear vertical gradient -->

<linearGradient id="gradientS" x1="0" x2="0" y1="0" y2="1">
<stop offset="20%" stop-color="#00ff00" />
<stop offset="40%" stop-color="#ff9900" />
<stop offset="100%" stop-color="#cc0000" />
</linearGradient>

<!--Color radial color gradient -->

<radialGradient id="RadialGradient1">
<stop offset="0%" stop-color="#00ff00"/>
<stop offset="100%" stop-color="#c0c0c0"/>
</radialGradient>

<radialGradient id="RadialGradient2" cx="0.25" cy="0.25" r="0.25">
<stop offset="0%" stop-color="#ff5050"/>
<stop offset="100%" stop-color="#339966"/>
</radialGradient>
